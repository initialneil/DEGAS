dataset:
  resolution: 1

model:
  sh_degree: 3 # default: 3

pipe:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False

optim:
  optim_xyz:
    lr: 0.00016
    scheduler_args:
      lr_init: 0.00016
      lr_final: 0.0000016
      lr_delay_mult: 0.01
      lr_max_steps: ${optim.total_iteration}
  optim_features_dc:
    lr: 0.0025
  optim_features_rest:
    lr: ${div:${optim.optim_features_dc.lr}, 20.0}
  optim_opacity:
    lr: 0.05
  optim_scaling:
    lr: 0.005
  optim_rotation:
    lr: 0.001
    
  total_iteration: 30000
  save_every_iter: 10000
    
  densify_from_iter: 100
  densification_interval: 100
  densify_until_iter: ${int:${mul:${optim.total_iteration}, 0.5}}
  opacity_reset_start_iter: 0
  opacity_reset_interval: 3000
  
  size_threshold: 20
  densify_grad_threshold: 0.0002
  min_opacity: 0.005
  max_n_gauss: 150000
  
  lambda_ssim: 0.2
  lambda_perceptual: 0.05
  lambda_scaling_skew: 0.0

  #scheduler:
  #  milestone: 2000
  #  decay: 0.33






